<style>

*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--fb);font-variant-numeric:lining-nums}

button.b:hover{background:var(--pri2)}button.g{background:none;color:var(--pg,var(--pri));border:1px solid var(--pg,var(--pri))}button.d{background:none;color:var(--at);border:1px solid var(--at)}

.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:480px}th{background:var(--pri);color:var(--on,#fff);text-align:left;padding:8px;font-size:13px;white-space:nowrap}td{padding:8px;border-top:1px solid var(--ln);white-space:nowrap}td.n,th.n{text-align:right}tr.t td{font-weight:700;background:var(--bg)}

.sum{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.sum span{background:var(--bg);border:1px solid var(--ln);border-radius:9px;padding:6px 10px;font-size:13px}.sum b{font-size:16px}
.mut{color:var(--mut);font-size:13px}.bad{color:var(--at)}.ok{color:var(--pt)}
.empty{text-align:center;padding:26px 10px;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;display:none;z-index:9}
.logo-prev{height:64px;width:64px;object-fit:contain;border:1px solid var(--ln);border-radius:10px;background:#fff}
.rh{display:none}
.ex{margin-left:10px;background:none;border:1px solid var(--on,#fff);color:var(--on,#fff);border-radius:8px;padding:6px 12px;font:600 13px var(--fb);cursor:pointer}.ex.x{background:#d92d20;border-color:#d92d20;color:#fff}.ex.x:hover{background:#b42318;border-color:#b42318}
.sw{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0 12px}.swb{width:38px;height:38px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--ln);cursor:pointer;padding:0}.swb.on{box-shadow:0 0 0 3px var(--ink)}.cp{flex:0 0 auto;display:flex;align-items:center;gap:8px}.cp input{width:44px;height:38px;padding:0;margin:0;border:0;background:none}
.row>button{flex:0 0 auto}.card>.tw:not(:first-child){margin-top:16px;clear:both;position:relative}.ck{display:flex;align-items:center;gap:8px;flex:none;font-size:14px}.ck input{margin:0;flex:none}
label{text-transform:capitalize}.ck{text-transform:none}th{text-transform:capitalize}

details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:'Show ▾';font:600 12px var(--fb);color:var(--pg,var(--pri));border:1px solid var(--pg,var(--pri));border-radius:999px;padding:4px 11px;flex:none}
details.card[open]>summary::after{content:'Hide ▴'}details.card[open]>summary{margin-bottom:10px}
summary:focus-visible{outline:3px solid #f2a900;outline-offset:2px}
.edb{background:var(--h);color:var(--ht);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:700;margin:10px 0}
.cal.lk .day{cursor:not-allowed}
.pr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--ln)}.pr.dn .pt{text-decoration:line-through;opacity:.6}.pt small{color:var(--mut);font-weight:400}.pa{display:flex;gap:6px;flex:none}.gh{font-weight:700;margin:14px 0 2px;font-size:14px;color:var(--pg,var(--pri))}.pc{flex:1;min-width:0;align-items:flex-start;font-size:15px;color:var(--ink)}.pc input{margin-top:4px;width:20px;height:20px}.bd{background:#d92d20;color:#fff;border-radius:999px;padding:0 6px;font-size:11px;margin-left:2px}
.chip{display:inline-block;border:1px solid;border-radius:999px;padding:0 9px;font-size:12px;font-weight:700}.pa{flex-wrap:wrap;justify-content:flex-end}
#dash{max-width:980px;margin:0 auto;padding:12px 14px 0}
.dtop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}

#flag{display:block}

.wx .wi{font-size:38px;line-height:1}.wt b{display:block;font-size:30px;line-height:1.05}.wt small{font-size:13px}
.wm{flex:1 1 220px;min-width:0}.wd1{font-weight:700;font-size:14px}.wd2{font-size:12.5px;margin-top:2px}
.w-sun{background:linear-gradient(120deg,#c2570c,#9a3412)}.w-cloud{background:linear-gradient(120deg,#5b6b7e,#334155)}.w-rain{background:linear-gradient(120deg,#2563eb,#1e3a8a)}.w-storm{background:linear-gradient(120deg,#5b21b6,#1e1b4b)}.w-snow{background:linear-gradient(120deg,#0e7490,#475569)}.w-night{background:linear-gradient(120deg,#1e3a8a,#312e81)}
.spb{margin-top:10px;padding:10px 14px;border-radius:12px;background:linear-gradient(90deg,#be185d,#c2410c,#15803d,#1d4ed8);color:#fff;font-weight:700;text-align:center}
#lk{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px}
.lkb{width:100%;max-width:320px;text-align:center}.lkl{font-size:40px}.lkb h2{margin:6px 0}
.dots{display:flex;justify-content:center;gap:14px;margin:16px 0}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--pri)}.dots i.f{background:var(--pri)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.pad button{height:64px;border-radius:50%;border:1px solid var(--ln);background:var(--card);color:var(--ink);font:600 24px var(--fb);cursor:pointer}.pad button:active{background:var(--pri);color:var(--on,#fff)}
.lkf{margin-top:18px;background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;font-size:13px}
@media print{#dash,#lk{display:none!important}}
.ex:disabled{opacity:.6;cursor:wait}.ex:hover{background:rgba(128,128,128,.25)}
.sy{margin-left:auto;font-size:12px;opacity:.9;text-align:right}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
@media(max-width:700px){
header{padding:10px 14px;flex-wrap:wrap;row-gap:6px}header img{height:38px;width:38px}header h1{font-size:17px}
nav{position:fixed;top:auto;bottom:0;left:0;right:0;border-bottom:0;border-top:1px solid var(--ln);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));gap:2px;z-index:5}

.card{padding:12px}

button.b{min-height:44px;padding:10px 14px}button.s{min-height:38px;padding:8px 12px}
.cal{gap:3px}.day{min-height:54px;padding:3px}.day b{font-size:14px}.day small{font-size:10px}

}
@media print{header,nav,.noprint,#toast{display:none!important}.rh{display:flex;align-items:center;gap:10px;margin-bottom:10px}.rh img{height:40px}body{background:#fff;color:#000}.card{border:0;padding:0}th{background:#ddd!important;color:#000!important}}
/* ===== Money module ===== */
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--so:#8b9099;--exp:#b42318;--inc:#0b7a3b}

body.mm #dash{display:none!important}
#modesw{max-width:980px;margin:0 auto;padding:10px 14px 0;display:flex;gap:8px}

.mchip.on{background:var(--pri);border-color:var(--pri);color:var(--on,#fff)}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}

.mt.big{grid-column:1/-1;background:var(--card)}
.mt.big b{font-size:24px}
.inc{color:var(--inc)}.exp{color:var(--exp)}
.mrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--ln);padding:9px 2px;color:var(--ink);font:inherit;cursor:pointer}

 return out}

 const top=by.slice(0,7).map((x,i)=>({v:x.v,n:x.n,name:mC(x.c).name,icon:mC(x.c).icon,svg:mC(x.c).svg,col:`var(${MPAL[i]})`}));
 if(by.length>7){const o=by.slice(7);top.push({v:o.reduce((s,x)=>s+x.v,0),n:o.reduce((s,x)=>s+x.n,0),name:'Other ('+o.length+' categories)',icon:'…',col:'var(--so)'})}
 const pm=mAddM(ui.mm,-1),[pf,pt]=mMonthRange(pm),pv=mSum(mFilter({acc:ui.macc,from:pf,to:pt}))[ty=='-'?'e':'i'],pct=x=>(x*100/tot).toFixed(1).replace(/\.0$/,'')+'%';
 let ex=`In ${mMonthName(ui.mm)} you ${verb} <b>${mFmt(tot)}</b> across ${by.length} categor${by.length>1?'ies':'y'} (${recs.filter(r=>r.ok!==0).length} records). `;

 ui.mpx=ex;return mBox('Monthly summary by category',tg+`<div class="mpie">${mDonut(top,tot,ty)}<div class="mleg" id="mleg">${top.map((x,i)=>`<button class="mlr" data-i="${i}" onclick="mPieSel(${i})"><i style="background:${x.col}"></i><span class="nm">${mI(x)} ${esc(x.name)}</span><span class="vl">${mFmt(x.v)}</span><span class="pc2">${pct(x.v)}</span></button>`).join('')}</div></div>
 <div class="mex" id="mpd" aria-live="polite">${ex}</div><p class="mut" style="margin:8px 0 0">How to read: each slice is one category’s share of the month’s ${nm.toLowerCase()}. Tap a slice or a row for details. Slices under 5% are labelled in the list only, and the smallest categories are grouped as “Other”.</p>`)},

/* donut with direct labels */
function mArc(cx,cy,r0,r1,a0,a1){if(a1-a0>=Math.PI*2-1e-4)a1=a0+Math.PI*2-1e-4;const X=(r,a)=>(cx+r*Math.cos(a)).toFixed(2),Y=(r,a)=>(cy+r*Math.sin(a)).toFixed(2),lg=a1-a0>Math.PI?1:0;
 return`M${X(r1,a0)} ${Y(r1,a0)}A${r1} ${r1} 0 ${lg} 1 ${X(r1,a1)} ${Y(r1,a1)}L${X(r0,a1)} ${Y(r0,a1)}A${r0} ${r0} 0 ${lg} 0 ${X(r0,a0)} ${Y(r0,a0)}Z`}
function mDonut(items,tot,ty){const cx=190,cy=122,R=78,r=48;let a=-Math.PI/2,p='',lab=[];
 items.forEach((x,i)=>{const f=x.v/tot,a1=a+f*Math.PI*2,mid=(a+a1)/2;p+=`<path data-i="${i}" d="${mArc(cx,cy,r,R,a,a1)}" style="fill:${x.col}" stroke="var(--card)" stroke-width="2" onclick="mPieSel(${i})"><title>${esc(x.name)}: ${mFmt(x.v)} (${(f*100).toFixed(1)}%)</title></path>`;if(f>=.05)lab.push({mid,i,t:(x.name.length>15?x.name.slice(0,14)+'…':x.name)+' '+Math.round(f*100)+'%'});a=a1});
 const sides=[[],[]];lab.forEach(l=>{const c=Math.cos(l.mid);l.x=cx+c*(R+8);l.y=cy+Math.sin(l.mid)*(R+8);l.ty=l.y;sides[c>=0?1:0].push(l)});
 let s='';sides.forEach((sd,k)=>{sd.sort((u,v)=>u.ty-v.ty);for(let i=1;i<sd.length;i++)if(sd[i].ty-sd[i-1].ty<14)sd[i].ty=sd[i-1].ty+14;const ov=sd.length?sd[sd.length-1].ty-(2*cy-4):0;if(ov>0)sd.forEach(z=>z.ty-=ov);
  sd.forEach(l=>{const dx=k?14:-14,ex=l.x+dx;s+=`<polyline points="${(cx+Math.cos(l.mid)*R).toFixed(1)},${(cy+Math.sin(l.mid)*R).toFixed(1)} ${l.x.toFixed(1)},${l.y.toFixed(1)} ${ex.toFixed(1)},${l.ty.toFixed(1)}" fill="none" stroke="var(--mut)" stroke-width="1"/><text x="${(ex+(k?3:-3)).toFixed(1)}" y="${(l.ty+4).toFixed(1)}" text-anchor="${k?'start':'end'}">${esc(l.t)}</text>`})});
 return`<svg viewBox="0 0 380 244" role="img" aria-label="Pie chart of ${ty=='-'?'expenses':'income'} by category">${p}${s}<text class="ct" x="${cx}" y="${cy-2}" text-anchor="middle">${mFmt(tot,0)}</text><text class="cs" x="${cx}" y="${cy+14}" text-anchor="middle">${ty=='-'?'total spent':'total income'}</text></svg>`}
function mPieSel(i){const on=ui.mps!=i;ui.mps=on?i:-1;document.querySelectorAll('.mpie path').forEach(p=>p.classList.toggle('dim',on&&p.dataset.i!=i));document.querySelectorAll('#mleg .mlr').forEach(b=>b.classList.toggle('on',on&&b.dataset.i==i));
 if(on){const b=document.querySelector(`#mleg .mlr[data-i="${i}"]`);$('#mpd').innerHTML=`<b>${esc(b.querySelector('.nm').textContent)}</b>: ${esc(b.querySelector('.vl').textContent)} — ${esc(b.querySelector('.pc2').textContent)} of the total.`}else $('#mpd').innerHTML=ui.mpx}

function mShade(t,ty){t=Math.pow(Math.max(0,Math.min(1,t)),.85);const d=mDark(),A=ty=='-'?(d?[104,58,58]:[252,205,205]):(d?[48,96,70]:[190,240,208]),B=ty=='-'?(d?[245,70,70]:[120,20,20]):(d?[34,205,100]:[14,82,44]);return'rgb('+A.map((a,i)=>Math.round(a+(B[i]-a)*t)).join(',')+')'}

 d=ms.map(m=>{const[f,t]=mMonthRange(m),s=mSum(mFilter({acc:ui.macc,from:f,to:t,cat}));return{m,i:s.i,e:s.e}}),sh=c?c.s:'';
 const mx=Math.max(1,...d.map(x=>sh=='-'?x.e:sh=='+'?x.i:Math.max(x.i,x.e)));$('#mtt2').textContent=(c?c.icon+' '+c.name:'All categories')+' — last 12 months';

 recs.forEach(r=>{if(r.ok!==0)day.set(r.d,(day.get(r.d)||0)+(r.s=='+'?r.m:-r.m))});let h='',cur='',n=0;

const GD_HELP='Google sent back a web page instead of data. Check these three things in Google Apps Script: (1) Deploy > Manage deployments > pencil > Version: New version > Deploy. (2) “Who has access” must be Anyone. (3) Use the Web app address that ends with /exec.';
async function gdApi(action,x){const c=new AbortController(),t=setTimeout(()=>c.abort(),60000);
 try{const r=await fetch(GD.url,{method:'POST',body:JSON.stringify(Object.assign({key:GD.key,action},x)),signal:c.signal}),tx=await r.text();let j;
  try{j=JSON.parse(tx)}catch(e){throw new Error(/^\s*</.test(tx)?GD_HELP:'Unexpected reply from Google. '+tx.slice(0,80))}
  if(!j.ok){const e=new Error(j.error||'Request failed');e.conflict=!!j.conflict;throw e}return j}
 catch(e){if(e.name=='AbortError')throw new Error('Timed out');if(e instanceof TypeError)throw new Error('Could not reach Google. Check your internet connection.');throw e}finally{clearTimeout(t)}}

/* ===== MONEY MODULE: two-way sync through Google Drive =====
   Every account, category, record and budget gets a global id (g). Devices merge by g: the newest change wins,
   deletions are remembered (tombstones), and the merged copy is stored in Drive as one versioned file. */
const hsh=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};
const syKey=o=>JSON.stringify(o,(k,v)=>k=='u'||k=='id'?undefined:(v&&typeof v=='object'&&!Array.isArray(v)?Object.fromEntries(Object.keys(v).sort().map(z=>[z,v[z]])):v));
let msyBusy=false;
/* this device's data in portable form (global ids instead of local ids); also detects local edits and deletions */
function syLocal(R){const now=Date.now();M.tb=M.tb||{};M.sy=M.sy||{};
 const used=new Set();[M.acc,M.cat,M.mv].forEach(a=>a.forEach(o=>{if(o.g)used.add(o.g)}));
 const give=(o,b)=>{if(o.g)return;let k=0;while(used.has(b+'.'+k))k++;o.g=b+'.'+k;used.add(o.g)};
 M.acc.forEach(a=>give(a,'A'+String(a.name).toLowerCase()));M.cat.forEach(c=>give(c,'C'+c.s+String(c.name).toLowerCase()));
 const ag={},cg={};M.acc.forEach(a=>ag[a.id]=a.g);M.cat.forEach(c=>cg[c.id]=c.g);
 M.mv.forEach(r=>give(r,'R'+hsh([ag[r.a],cg[r.c],r.m,r.s,r.d,r.t,r.n].join('|')).toString(36)));
 M.bud.forEach(b=>{b.g='B'+cg[b.c]});
 const rem={};if(R)['acc','cat','mv','bud'].forEach(k=>(R[k]||[]).forEach(p=>{rem[p.g]=p}));
 let changed=false;const seen=new Set();
 const mk=(o,p)=>{seen.add(p.g);const h=hsh(syKey(p));if(M.sy[p.g]!==h){const r=rem[p.g];if(r&&hsh(syKey(r))==h)o.u=r.u||0;else{o.u=now;changed=true}}p.u=o.u||0;return p};
 const acc=M.acc.map(a=>{const{id,...f}=a;return mk(a,f)}),cat=M.cat.map(c=>{const{id,...f}=c;return mk(c,f)}),
  mv=M.mv.filter(r=>ag[r.a]&&cg[r.c]).map(r=>{const{id,...f}=r;f.a=ag[r.a];f.c=cg[r.c];return mk(r,f)}),
  bud=M.bud.filter(b=>cg[b.c]).map(b=>{const f={g:b.g,c:cg[b.c],amt:b.amt};return mk(b,f)});
 Object.keys(M.sy).forEach(g=>{if(!seen.has(g)){M.tb[g]=now;changed=true}});
 return{acc,cat,mv,bud,changed}}
function syMerge(L,R){const now=Date.now(),tb=Object.assign({},R&&R.tb||{});Object.keys(M.tb).forEach(g=>{tb[g]=Math.max(tb[g]||0,M.tb[g])});
 Object.keys(tb).forEach(g=>{if(tb[g]<now-15552e6)delete tb[g]});
 const out={tb};['acc','cat','mv','bud'].forEach(k=>{const mp=new Map();L[k].forEach(p=>mp.set(p.g,p));
  (R&&R[k]||[]).forEach(r=>{const l=mp.get(r.g);if(!l||(r.u||0)>(l.u||0))mp.set(r.g,r)});
  mp.forEach((p,g)=>{if(tb[g]&&tb[g]>=(p.u||0))mp.delete(g)});out[k]=[...mp.values()]});return out}
function sySame(A,R){if(!R)return false;const ka=Object.keys(A.tb||{}),kr=Object.keys(R.tb||{});if(ka.length!=kr.length||ka.some(g=>(R.tb||{})[g]!==A.tb[g]))return false;
 for(const k of['acc','cat','mv','bud']){const rl=R[k]||[];if(A[k].length!=rl.length)return false;const rm=new Map(rl.map(p=>[p.g,p]));
  for(const p of A[k]){const r=rm.get(p.g);if(!r||(r.u||0)!=(p.u||0)||hsh(syKey(r))!=hsh(syKey(p)))return false}}return true}
/* put the merged result into this device's data (keeping local ids; creating new ones for new items) */
function syApplyList(local,items,upd,mk){const mg=new Map(items.map(p=>[p.g,p])),keep=local.filter(o=>mg.has(o.g)),have=new Set(keep.map(o=>o.g));let add=0;
 keep.forEach(o=>upd(o,mg.get(o.g)));items.forEach(p=>{if(!have.has(p.g)){keep.push(mk(p));add++}});return{list:keep,add,del:local.length-(keep.length-add)}}
function syApply(out){const fld=(o,p)=>{Object.keys(o).forEach(k=>{if(k!='id'&&!(k in p))delete o[k]});Object.assign(o,p)};
 const A=syApplyList(M.acc,out.acc,fld,p=>Object.assign({id:'a'+M.nx++},p)),C=syApplyList(M.cat,out.cat,fld,p=>Object.assign({id:'c'+M.nx++},p));
 M.acc=A.list;M.cat=C.list;const ai={},ci={};M.acc.forEach(a=>ai[a.g]=a.id);M.cat.forEach(c=>ci[c.g]=c.id);
 const mvs=out.mv.filter(p=>ai[p.a]&&ci[p.c]).map(p=>Object.assign({},p,{a:ai[p.a],c:ci[p.c]})),mg=new Map(mvs.map(p=>[p.g,p]));
 const keep=M.mv.filter(o=>mg.has(o.g)),have=new Set(keep.map(o=>o.g));let add=0;
 keep.forEach(o=>{fld(o,mg.get(o.g))});mvs.forEach(p=>{if(!have.has(p.g)){keep.push(Object.assign({id:M.nx++},p));add++}});
 const del=M.mv.length-(keep.length-add);M.mv=keep;
 M.bud=out.bud.filter(p=>ci[p.c]).map(p=>({g:p.g,c:ci[p.c],amt:p.amt,u:p.u}));
 M.tb=out.tb;M.sy={};['acc','cat','mv','bud'].forEach(k=>out[k].forEach(p=>{M.sy[p.g]=hsh(syKey(p))}));
 return{add:add+A.add+C.add,del:del+A.del+C.del}}
async function mSyncMoney(){if(!gdOn())throw new Error('Money sync is not set up yet.');if(msyBusy)throw new Error('Money sync is already running.');msyBusy=true;
 try{mFlush();
  for(let tries=0;tries<4;tries++){
   const r=await gdApi('sget',{have:M.sv||0});let R=r.same?null:(r.data||null);
   if(!r.same&&!R){M.sy={};M.sv=0}
   const L=syLocal(R);let out,put;
   if(r.same){out={acc:L.acc,cat:L.cat,mv:L.mv,bud:L.bud,tb:Object.assign({},M.tb)};put=L.changed}
   else{out=syMerge(L,R);put=!sySame(out,R)}
   let nv=r.ver||0;
   if(put){try{const j=await gdApi('sput',{ver:nv,data:{v:2,acc:out.acc,cat:out.cat,mv:out.mv,bud:out.bud,tb:out.tb}});nv=j.ver}catch(e){if(e.conflict)continue;throw e}}
   const res=syApply(out);M.sv=nv;mDirty=true;mFlush();return res}
  throw new Error('Another device was syncing at the same time. Please try again.')}

 <details class="card" ${fo('m-ap',1)}><summary>Appearance</summary><div class="row"><label>Theme<select onchange="setTheme(this.value);draw()"><option value="auto" ${LOOK.th=='auto'?'selected':''}>Automatic (follow my device)</option><option value="light" ${LOOK.th=='light'?'selected':''}>Light</option><option value="dark" ${LOOK.th=='dark'?'selected':''}>Dark</option></select></label><label>Text size<select onchange="setFs(this.value);draw()">${[[13,'Extra small'],[14,'Small'],[15,'Normal'],[17,'Large'],[19,'Extra large']].map(([v,n])=>`<option value="${v}" ${(LOOK.fs||15)==v?'selected':''}>${n}</option>`).join('')}</select></label>${fontSel()}${numSel()}</div>${fontPrev()}
 <h3 style="margin-top:14px">Colour</h3><div class="sw">${PRE.map(c=>`<button class="swb ${(LOOK.acc||PRE[0]).toLowerCase()==c?'on':''}" style="background:${c}" aria-label="Colour ${c}" onclick="setAcc('${c}')"></button>`).join('')}<label class="cp">Custom<input type="color" value="${LOOK.acc||PRE[0]}" onchange="setAcc(this.value)"></label></div>
 <h3 style="margin-top:14px">Title bar</h3><label class="ck"><input type="checkbox" ${PF.clock?'checked':''} onchange="setPF('clock',this.checked?1:0)"> Show the clock</label><label class="ck" style="margin-top:6px"><input type="checkbox" ${PF.wx?'checked':''} onchange="setPF('wx',this.checked?1:0)"> Show the weather card</label><label class="ck" style="margin-top:6px"><input type="checkbox" ${PF.flag?'checked':''} onchange="setPF('flag',this.checked?1:0)"> Show the National Flag</label>
 <p class="mut" style="margin:8px 0 0">The clock, weather and flag appear in the title bar at the top. To choose the weather place or °C/°F, open Settings › Household.</p>
 <div class="row" style="margin-top:10px"><button class="b g s" onclick="resetLook()">Reset appearance</button></div><p class="mut">Appearance is saved on this device only, so your phone and computer can look different.</p></details>
 <details class="card" ${fo('m-dt',1)}><summary>Date and time format</summary><div class="row"><label>Date format${mSel('df',M.pf.df,MDFS.map(f=>[f,f+'  ('+f.replace(/yyyy|dd|mm|MMM/g,t=>({yyyy:'2026',dd:'13',mm:'11',MMM:'Nov'}[t]))+')']))}</label><label>Time format${mSel('tf',M.pf.tf,[['12','12-hour (03:30 pm)'],['24','24-hour (15:30)']])}</label><label>First day of the week${mSel('fw',M.pf.fw,[[1,'Monday'],[0,'Sunday'],[6,'Saturday']])}</label></div>
 <p class="mut">Preview: <b>${mFd(mTd())}</b> at <b>${mFt(mNow())}</b>. Weeks start on ${WDN[M.pf.fw]}. These apply across the whole app.</p></details>
 <details class="card" ${fo('m-btn',1)}><summary>Buttons, colours and layout</summary><h3>Add-record buttons</h3><div class="row"><label>Position${mSel('pos',b.pos,[['br','Floating, bottom right'],['bl','Floating, bottom left'],['bc','Floating, bottom centre'],['dash','Inside the dashboard']],'mBtn')}</label><label>Shape${mSel('shape',b.shape,[['pill','Pill'],['rounded','Rounded box'],['square','Square'],['circle','Circle (symbol only)']],'mBtn')}</label>
 <label>Size${mSel('size',b.size,[['s','Small'],['m','Medium'],['l','Large']],'mBtn')}</label><label>Order${mSel('order',b.order,[['ei','Expense, then Income'],['ie','Income, then Expense']],'mBtn')}</label></div>
 <label class="ck" style="margin-top:8px"><input type="checkbox" ${b.lab?'checked':''} onchange="mBtn('lab',this.checked?1:0)"> Show the words “Expense” and “Income” on the buttons</label>
 <h3 style="margin-top:12px">Expense button colour</h3>${sw('exp',b.exp,['#d92d20','#c2410c','#be185d','#7c3aed','#334155'])}<h3>Income button colour</h3>${sw('inc',b.inc,['#15803d','#0e7c66','#1d4ed8','#a16207','#334155'])}
 <div class="mbtns" style="padding:10px;border:1px dashed var(--ln);border-radius:12px"><span class="mut" style="width:100%;text-align:center">Preview</span>${mBtns()}</div>
 <h3 style="margin-top:14px">Dashboard cards: show and order</h3>${M.pf.cards.map(([k,on],i)=>`<div class="mset"><label class="ck mtx"><input type="checkbox" ${on?'checked':''} onchange="mCardOn(${i},this.checked)"> ${CARDN[k]}</label><div class="pa"><button class="b g s" ${i?'':'disabled'} onclick="mCardMove(${i},-1)" aria-label="Move up">▲</button><button class="b g s" ${i<M.pf.cards.length-1?'':'disabled'} onclick="mCardMove(${i},1)" aria-label="Move down">▼</button></div></div>`).join('')}
 <div class="row" style="margin-top:10px"><button class="b g s" onclick="M.pf.btn=MDEF().pf.btn;M.pf.cards=MDEF().pf.cards;mSave();mDraw();toast('Buttons and layout reset')">Reset buttons and layout</button></div></details>
 <details class="card" ${fo('m-lk',1)}><summary>Payments from the Help Register</summary><p class="mut">Money paid to your helpers (Payments tab) and amounts written in the Journal can be counted as expenses here, so your reports show everything. They are read-only here: change them in the Help Register.</p>
 <label class="ck"><input type="checkbox" ${M.pf.lk.pay?'checked':''} onchange="mLk('pay',this.checked?1:0)"> Include payments to people (Household help)</label><label class="ck" style="margin-top:6px"><input type="checkbox" ${M.pf.lk.jr?'checked':''} onchange="mLk('jr',this.checked?1:0)"> Include amounts from Journal entries</label>
 <div class="row" style="margin-top:10px"><label>Charge them to account<select onchange="mLk('acc',this.value)">${M.acc.map(a=>`<option value="${a.id}" ${a.id==mDefAcc()?'selected':''}>${a.icon} ${esc(a.name)}</option>`).join('')}</select></label><label>Count only from this date (optional)${mDF('mlkf',M.pf.lk.from,'mLkD')}</label></div>
 <p class="mut">Tip: if you already enter these same payments here as normal records, set a start date, or turn this off, so they are not counted twice.</p></details>
 <details class="card" ${fo('m-bud',1)}><summary>Monthly budgets</summary>${M.bud.map((x,i)=>`<div class="mset"><span class="mtx"><b>${mI(mC(x.c))} ${esc(mC(x.c).name)}</b></span><input type="number" min="0" style="width:120px;margin:0" value="${x.amt}" onchange="M.bud[${i}].amt=+this.value||0;mSave();mDraw()" aria-label="Budget"><button class="b d s" onclick="M.bud.splice(${i},1);mSave();mDraw()">Remove</button></div>`).join('')||'<p class="mut">No budgets yet.</p>'}
 <div class="row" style="margin-top:10px"><label>Category<select id="mbc">${mCats('-').filter(c=>!M.bud.some(x=>x.c==c.id)).map(c=>`<option value="${c.id}">${c.icon} ${esc(c.name)}</option>`).join('')}</select></label><label>Monthly amount<input id="mba" type="number" min="0"></label><button class="b" onclick="mBudAdd()">Add budget</button></div></details>
 ${mGdCard()}
 <details class="card" ${fo('m-data',1)}><summary>Import, backup and reset</summary><p class="mut">Your money records are stored on this device only. ${M.mv.length} records are saved here.</p>
 <div class="row"><label>Import a data file (expense-data.json or a backup)<input type="file" accept=".json,application/json" onchange="mImportFile(this)"></label><label style="flex:0 1 240px">When importing${mSel('mim',ui.mim||(M.mv.length?'add':'replace'),[['replace','Replace all money data'],['add','Add only new records']],'mImMode')}</label></div>
 <div class="row" style="margin-top:10px"><button class="b" onclick="mBackup()">Download backup file</button><button class="b g" onclick="mBackupText()">Show backup as text</button><button class="b d" onclick="mErase()">Erase all money data</button></div><div id="mtx"></div></details>`}
function mCatForm(c){const o=c||{name:'',icon:ui.mcs=='-'?'📦':'💰'};return`<div class="mex"><div class="row"><label style="flex:2 1 180px">Name<input id="mcn" value="${esc(o.name)}"></label>${mIconField('mci','mcsv',o)}</div>${mEmoRow('mci',EMO)}
 <div class="row" style="margin-top:10px"><button class="b" onclick="mCatSave('${c?c.id:''}')">Save</button><button class="b g" onclick="ui.mce=null;mDraw()">Cancel</button></div></div>`}
function mCatSave(id){const n=$('#mcn').value.trim(),ic=$('#mci').value.trim()||'📦',sv=$('#mcsv').value||undefined,s=id?mC(id).s:ui.mcs;if(!n)return toast('Enter a name.');if(M.cat.some(c=>c.id!=id&&c.s==s&&c.name.toLowerCase()==n.toLowerCase()))return toast('That category already exists.');
 if(id){const c=mC(id);c.name=n;c.icon=ic;c.svg=sv}else M.cat.push({id:'c'+M.nx++,name:n,s,icon:ic,svg:sv});ui.mce=null;mSave();toast('Category saved');mDraw()}
function mCatDel(c,n){const others=M.cat.filter(z=>z.s==c.s&&z.id!=c.id);return`<div class="mex">${n?`<p style="margin:0 0 8px">${n} records use “${esc(c.name)}”. Move them to another category, then delete it.</p><div class="row"><label>Move to<select id="mcm">${others.map(z=>`<option value="${z.id}">${z.icon} ${esc(z.name)}</option>`).join('')}</select></label><button class="b d" onclick="mCatDo('${c.id}',1)">Move and delete</button><button class="b g" onclick="ui.mce=null;mDraw()">Cancel</button></div>`:`<div class="row"><span>Delete “${esc(c.name)}”?</span><button class="b d" onclick="mCatDo('${c.id}',0)">Delete</button><button class="b g" onclick="ui.mce=null;mDraw()">Cancel</button></div>`}</div>`}
function mCatDo(id,mv){if(mv){const to=$('#mcm').value;if(!to)return toast('Choose a category to move the records to.');M.mv.forEach(r=>{if(r.c==id)r.c=to});M.bud.forEach(b=>{if(b.c==id)b.c=to})}M.bud=M.bud.filter(b=>b.c!=id);M.cat=M.cat.filter(c=>c.id!=id);ui.mce=null;mSave();toast('Category deleted');mDraw()}
function mBudAdd(){const c=$('#mbc').value,a=+$('#mba').value;if(!c||!(a>0))return toast('Choose a category and enter an amount above zero.');M.bud.push({c,amt:a});mSave();mDraw()}
function mLkD(el){const v=mParseD(el.value);if(el.value.trim()&&!v){toast('Enter the date as '+M.pf.df+'.');return}mLk('from',v)}
function mImMode(k,v){ui.mim=v}
function mImportFile(inp){const f=inp.files[0];if(!f)return;const r=new FileReader;r.onload=()=>mImportText(String(r.result));r.onerror=()=>toast('Could not read that file.');r.readAsText(f);inp.value=''}
function mImportText(t){let x;try{x=JSON.parse(t.replace(/^﻿/,''))}catch(e){return toast('That file is not a valid data file.')}
 const mode=M.mv.length||M.acc.length?(ui.mim||'add'):'replace';if(mode=='replace'&&M.mv.length&&!confirm('This replaces all money records on this device with the file’s contents. Continue?'))return;
 try{const r=mImport(x,mode);toast(`Imported ${r.added} records`+(r.skipped?` (${r.skipped} already here)`:''));ui.mtab=ui.mtab=='ms'?'ms':'mh';draw()}catch(e){toast(e.message)}}
function mBackup(){const t=JSON.stringify(mExport());if(!mDownload('money-backup-'+mTd()+'.json',t,'application/json'))mBackupText();else toast('Backup file created')}
function mBackupText(){$('#mtx').innerHTML=`<p class="mut">Copy this text and keep it safe. You can import it later as a file saved with a .json ending.</p><textarea id="mtb" rows="6" readonly>${esc(JSON.stringify(mExport()))}</textarea><div class="row" style="margin-top:8px"><button class="b s" onclick="$('#mtb').select();try{document.execCommand('copy');toast('Copied')}catch(e){toast('Press Ctrl+C to copy')}">Copy</button></div>`}
function mErase(){if(!confirm('Erase ALL money records, accounts and categories on this device? This cannot be undone. Make a backup first if unsure.'))return;if(!confirm('Really erase everything in Money?'))return;const p=M.pf;M=MDEF();M.pf=p;mSave();mFlush();toast('Money data erased');draw()}

/* ---- start ---- */
mSw();if(ui.mode=='money')draw();

draw();
</script></body></html>
